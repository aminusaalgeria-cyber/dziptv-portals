
name: RSS Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read RSS and update data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          with open("rss_source.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          if not config.get("enabled", False):
              print("RSS monitoring is disabled.")
              raise SystemExit(0)

          url = config["rss_url"]

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "DZ-IPTV-RSS-Monitor/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              xml_data = response.read()

          root = ET.fromstring(xml_data)

          def get_text(element, names):
              for child in element:
                  name = child.tag.split("}")[-1]
                  if name in names:
                      if name == "link" and child.attrib.get("href"):
                          return child.attrib["href"]
                      return "".join(child.itertext()).strip()
              return ""

          with open("rss_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          old_items = data.get("items", [])
          known = {
              item.get("guid") or item.get("link")
              for item in old_items
          }

          new_items = []

          for element in root.iter():
              if element.tag.split("}")[-1] not in ("item", "entry"):
                  continue

              item = {
                  "title": get_text(element, ["title"]),
                  "link": get_text(element, ["link"]),
                  "guid": get_text(element, ["guid", "id"]),
                  "date": get_text(
                      element,
                      ["pubDate", "published", "updated"]
                  ),
                  "description": get_text(
                      element,
                      ["description", "summary", "content"]
                  )[:1000]
              }

              item["guid"] = item["guid"] or item["link"]
              key = item["guid"] or item["link"]

              if key and key not in known:
                  new_items.append(item)
                  known.add(key)

          if new_items:
              data["items"] = (new_items + old_items)[:100]
              data["last_updated"] = datetime.now(
                  timezone.utc
              ).isoformat()

              with open("rss_data.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)

              print(f"Added {len(new_items)} new RSS posts.")
          else:
              print("No new RSS posts found.")
          PY

      - name: Save changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS data"
            git push
          else
            echo "No changes to save."
          fi
