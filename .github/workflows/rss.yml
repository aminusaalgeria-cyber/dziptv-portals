name: RSS Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Read RSS and update data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          with open("rss_source.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          if not config.get("enabled", False):
              print("RSS monitoring is disabled.")
              raise SystemExit(0)

          url = config["rss_url"]

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"}
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data_source = json.loads(response.read().decode("utf-8"))
          except Exception as e:
              print(f"Error fetching or parsing data: {e}")
              raise SystemExit(1)

          with open("rss_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          old_items = data.get("items", [])
          known = {
              item.get("guid") or item.get("link")
              for item in old_items
          }

          new_items = []

          # قراءة من JSON ديال Blogger
          entries = data_source.get("feed", {}).get("entry", [])
          
          for entry in entries:
              title = entry.get("title", {}).get("$t", "")
              
              link = ""
              for l in entry.get("link", []):
                  if l.get("rel") == "alternate":
                      link = l.get("href", "")
                      break
              
              # هنا كنجيبو المحتوى كامل (content) ماشي غير الوصف المقطوع (summary)
              content = entry.get("content", {}).get("$t", "")
              
              guid = entry.get("id", {}).get("$t", "")
              date = entry.get("published", {}).get("$t", "")

              item = {
                  "title": title,
                  "link": link,
                  "guid": guid,
                  "date": date,
                  "description": content # بلا ما نقطعو!
              }
              
              item["guid"] = item["guid"] or item["link"]
              key = item["guid"] or item["link"]
              
              if key and key not in known:
                  new_items.append(item)
                  known.add(key)

          if new_items:
              data["items"] = (new_items + old_items)[:500] # رفعنا العدد لـ 500 مقال
              data["last_updated"] = datetime.now(timezone.utc).isoformat()
              
              with open("rss_data.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"Added {len(new_items)} new posts.")
          else:
              print("No new posts found.")
          PY

      - name: Save changes to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update RSS data"
            git push
          else
            echo "No changes to save."
          fi
